:root { --paper:#f3f4ef; --cell:#f9faf6; --paper2:#e9ece4; --slot:#e2e6dd; --rule:#c9cfc6; --ink:#17191c; --ink2:#41474e; --ink3:#656b72; --press:#6e7b86; --amber:#d99a00; --act:#c8372a; --ok:#1f8a55; --hl: rgba(200,55,42,.17);
  --sans: 'Anek Latin','Anek Devanagari',system-ui,sans-serif; --mono: 'Martian Mono',ui-monospace,monospace; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #2a2c2f; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); font-family: var(--sans); color: var(--ink); font-variant-numeric: tabular-nums; transform-origin: 0 0; }
.layer, .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
.abs { position: absolute; white-space: nowrap; }
.dev { font-family: 'Anek Devanagari', var(--sans); }
.tline { position: absolute; top: 523px; font-size: 28px; font-weight: 450; letter-spacing: -.01em; white-space: nowrap; line-height: 34px; }
.tline span.w { display: inline-block; position: relative; z-index: 1; }
.hl { position: absolute; background: var(--hl); border-radius: 3px; z-index: 0; }
.panel { position: absolute; background: var(--cell); border: 1px solid var(--rule); border-radius: 2px; box-shadow: 0 1px 2px rgba(23,25,28,.04), 0 10px 30px rgba(23,25,28,.06); }
.chip { position: absolute; font: 500 13px var(--mono); color: var(--ink2); background: var(--slot); padding: 6px 9px 5px; border-radius: 2px; white-space: nowrap; letter-spacing: .02em; }
.lab { font: 500 13px var(--mono); color: var(--ink3); letter-spacing: .06em; text-transform: uppercase; }
.mono { font-family: var(--mono); }
.card { position: absolute; border-radius: 2px; }
.hole { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.row { position: absolute; }
.btn { position: absolute; font: 600 20px var(--sans); border-radius: 2px; text-align: center; white-space: nowrap; }
#cursor { position: absolute; width: 26px; height: 36px; left: 0; top: 0; transform-origin: 3px 3px; z-index: 50; }
.ripple { position: absolute; border-radius: 50%; border: 2px solid var(--ink); }
.spin { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--slot); border-top-color: var(--ink); }
.check { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); }
.check svg { position: absolute; left: 4px; top: 5px; }
canvas { position: absolute; left: 0; top: 0; }
#ui { position: fixed; left: 0; right: 0; bottom: 0; height: 54px; background: #17191c; color: #f9faf6; display: flex; align-items: center; gap: 14px; padding: 0 16px; font: 500 14px var(--mono); z-index: 10; }
#ui button { font: 600 14px var(--sans); background: #f9faf6; color: #17191c; border: 0; padding: 7px 14px; border-radius: 2px; cursor: pointer; }
#ui input { flex: 1; accent-color: #c8372a; }

<div id="stage">
  <canvas id="grid" width="1920" height="1080"></canvas>

</div>
<div id="ui"><button id="pb">Play</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="tc">0.00</span></div>
<script>
/* ==========================================================================================
   NAADI · product demo · 1920×1080 · 67 s · 104 BPM (beat = 0.577 s)
   Beat sheet (time · on screen · sound)
   0.0  "Introducing" fades up on paper ................................. pad enters
   1.7  silk gradient sweeps in, logo + नाडी NAADI ........................ soft whoosh, first chord
   4.5  "Your loom has been telling you for weeks." push, highlight ....... percussion enters 4.6
   8.8  "It learns normal without a single fault label." ................ whoosh on push
  11.8  UI · Loom 03 channel chain: 56 cards punch in, camera rides ....... soft ticks every 4 cards
  14.4      change detected · card 24 flag .............................. tick
  17.6      pull back to the whole record, card 56 = act ................. whoosh
  19.8  "The envelope hears the bearing." .............................. whoosh
  22.8  UI · case file: type 6205-2RS, BPFO 85.8 Hz, spectrum, cursors .... key ticks, clicks
  27.8      push onto the BPFO peak ...................................... whoosh
  29.0      ranked causes: outer race 88.6% .............................. step ticks
  32.3  "Same bearing, two bills." ...................................... whoosh
  35.1  UI · repair windows: P10–P90, four windows priced, Thu ₹1,280 ...... ticks, hover, click
  43.8  "The agents prepare. You decide." ............................... whoosh
  46.4  UI · agent tape: 10 tool calls tick off, owner's gate, Approve ...... step ticks, click
  54.7  proof: "A median of 17.8 days of warning." count-up .............. riser into closer
  58.4  closer on silk: "Read the pulse of every loom / chakki / pump set." lift
  61.0  "Works offline, in English, हिंदी and मराठी." ......................
  63.0  end card: logo, NAADI, tagline, naadi-iota.vercel.app ............ chime, music resolves
   ========================================================================================== */
const D = 67;
window.VIDEO = { w: 1920, h: 1080, duration: D };
const RENDER = location.search.includes('render');

// ---------------- helpers
function spring(t, w = 14, z = 0.82) { if (t <= 0) return 0; if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t); const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
const track = (v0, keys) => t => { let v = v0, p = v0; for (const [tk, val, w, z] of keys) { v += (val - p) * spring(t - tk, w, z); p = val; } return v; };
const kf = keys => t => { if (t <= keys[0][0]) return keys[0][1]; for (let i = 1; i < keys.length; i++) { const [a, va] = keys[i - 1], [b, vb, e = ease] = keys[i]; if (t <= b) return lerp(va, vb, e((t - a) / (b - a))); } return keys[keys.length - 1][1]; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => (x = clamp(x), 1 - Math.pow(1 - x, 3));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const rng = s => () => (s = (s + 0x6D2B79F5) | 0, s = Math.imul(s ^ (s >>> 15), 1 | s), s ^= s + Math.imul(s ^ (s >>> 7), 61 | s), ((s ^ (s >>> 14)) >>> 0) / 4294967296);
const $ = id => document.getElementById(id);
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const css = (e, o) => { for (const k in o) e.style[k] = o[k]; };
const inr = v => '₹' + Math.round(v).toLocaleString('en-IN');
const camT = (c, cx, cy, z) => { c.style.transform = `translate(${960 - cx * z}px,${540 - cy * z}px) scale(${z})`; };
const SC = $('scenes');
const scenes = [];
function addScene(t0, t1, opts = {}) { const s = el('div', 'scene', SC); const c = el('div', 'cam', s); const o = { s, c, t0, t1, ...opts }; scenes.push(o); return o; }
const CHECK = '<svg width="14" height="12" viewBox="0 0 14 12"><path d="M1.5 6.5 L5.2 10 L12.5 1.8" fill="none" stroke="#f9faf6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LOGO = '<svg viewBox="0 0 32 32" width="100%" height="100%"><rect width="32" height="32" fill="#17191C"/><rect x="4" y="9" width="24" height="14" fill="#F3F4EF"/><circle cx="10" cy="16" r="2.4" fill="#17191C"/><circle cx="16" cy="16" r="2.4" fill="#17191C"/><circle cx="22" cy="16" r="2.4" fill="#C8372A"/></svg>';
const CURSOR = '<svg viewBox="0 0 26 36" width="26" height="36"><path d="M2 2 L2 28 L8.6 21.8 L13 32 L17.6 30 L13.3 20 L22 20 Z" fill="#17191C" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>';
const sfx = { ticks: [], keys: [], clicks: [], whoosh: [], steps: [], chime: [] };   // sound cue times (filled while building)

// ---------------- backgrounds (drawn once)
(function drawGrid() {
  const g = $('grid').getContext('2d');
  g.strokeStyle = 'rgba(64,108,98,0.05)'; g.lineWidth = 1;
  for (let x = 0; x <= 1920; x += 16) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, 1080); g.stroke(); }
  for (let y = 0; y <= 1080; y += 16) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(1920, y + .5); g.stroke(); }
  g.strokeStyle = 'rgba(64,108,98,0.075)';
  for (let x = 0; x <= 1920; x += 128) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, 1080); g.stroke(); }
  for (let y = 0; y <= 1080; y += 128) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(1920, y + .5); g.stroke(); }
})();
(function drawSilk() {
  const c = $('grad'), g = c.getContext('2d'), W = c.width, H = c.height;
  const base = g.createLinearGradient(0, 0, W, H);
  base.addColorStop(0, '#f6f7f2'); base.addColorStop(.42, '#eceee8'); base.addColorStop(.7, '#cdd3d1'); base.addColorStop(1, '#8f9aa1');
  g.fillStyle = base; g.fillRect(0, 0, W, H);
  const r = rng(7);
  g.save(); g.translate(W / 2, H / 2); g.rotate(-0.52);
  for (let i = 0; i < 9; i++) {
    const y = (i - 4) * 230 + (r() - .5) * 90, h = 160 + r() * 220, light = i % 2 === 0;
    const lg = g.createLinearGradient(0, y - h / 2, 0, y + h / 2);
    const c0 = light ? 'rgba(255,255,255,0)' : 'rgba(86,98,108,0)';
    const c1 = light ? `rgba(255,255,255,${.35 + r() * .25})` : `rgba(86,98,108,${.10 + r() * .08})`;
    lg.addColorStop(0, c0); lg.addColorStop(.5, c1); lg.addColorStop(1, c0);
    g.fillStyle = lg; g.fillRect(-W, y - h / 2, W * 2, h);
  }
  g.restore();
  const rad = g.createRadialGradient(W * .45, H * .45, 50, W * .45, H * .45, 900);
  rad.addColorStop(0, 'rgba(249,250,246,.85)'); rad.addColorStop(1, 'rgba(249,250,246,0)');
  g.fillStyle = rad; g.fillRect(0, 0, W, H);
})();
(function drawDots() {
  const g = $('dots').getContext('2d');
  for (let y = 40; y < 1080; y += 28) for (let x = 40; x < 1920; x += 28) {
    const d = Math.hypot((x - 960) / 960, (y - 540) / 540);
    g.fillStyle = `rgba(23,25,28,${0.13 * Math.max(0, 1 - d)})`; g.beginPath(); g.arc(x, y, 1.6, 0, 7); g.fill();
  }
})();

// ---------------- title-line scene: words fade in, camera pushes until the line spans ~75%, a phrase gets the highlight
function titleScene(t0, t1, text, hlFrom, hlCount, opts = {}) {
  const sc = addScene(t0, t1);
  const line = el('div', 'tline', sc.c);

function makeCursor(parent) {

// path: [[t, x, y], ...] quadratic-curved moves; clicks: [t, ...]
function placeCursor(cur, t, path, clicks, scale = 1.25) {

    break;

  const R = 10 + rip * 46;
  css(cur.r, { left: (x - R) + 'px', top: (y - R) + 'px', width: 2 * R + 'px', height: 2 * R + 'px', opacity: rk ? (1 - rip) * 0.35 : 0 });
}

    const bw = b.offsetWidth; css(b, { left: (960 - bw / 2) + 'px', top: '438px', opacity: k, transform: `scale(${0.95 + 0.05 * k})` });
    const tw = tg.offsetWidth; css(tg, { left: (960 - tw / 2) + 'px', opacity: k2 });
    const sf = tg.querySelector('#esf'); css(tg.querySelector('#ehl'), { left: '-6px', top: '-2px', height: '40px', width: ((sf.offsetWidth + 12) * ease(seg(t, 64.55, 65.1))) + 'px' });
    const uw = url.offsetWidth; css(url, { left: (960 - uw / 2) + 'px', opacity: k3 });
    const mw = team.offsetWidth; css(team, { left: (960 - mw / 2) + 'px', opacity: seg(t, 65.35, 65.85) * 0.9 });
    camT(c, 960, 540, 1 + 0.03 * seg(t, 63, 67));
  };
})();

// ==========================================================================================
// seek: a pure function of time
const grad = $('grad'), dots = $('dots');
window.seek = function (t) {
  t = clamp(t, 0, D - 1e-6);
  for (const s of scenes) {
    const a = seg(t, s.t0, s.t0 + 0.36), b = 1 - seg(t, s.t1 - 0.4, s.t1), o = Math.min(a, b);
    if (o <= 0.001) { s.s.style.display = 'none'; continue; }
    s.s.style.display = 'block'; s.s.style.opacity = o;
    s.s.style.filter = o < 0.98 ? `blur(${((1 - o) * 9).toFixed(2)}px)` : 'none';
    s.seek(t);
  }
  // silk gradient: brand moment (1.7–4.6) and the closer (58.2–end)
  const gA = Math.max(Math.min(seg(t, 1.6, 2.4), 1 - seg(t, 4.25, 4.75)), seg(t, 58.1, 58.8));
  const sweep = 1 - easeOut(seg(t, 1.6, 2.6)), drift = (t > 30 ? t - 58 : t - 1.6) * 7;
  css(grad, { opacity: gA, transform: `translate(${-460 - drift + sweep * 380}px, ${-210 + Math.sin(t * 0.15) * 18}px)`, display: gA > 0 ? 'block' : 'none' });
  const dA = Math.min(seg(t, 54.7, 55.4), 1 - seg(t, 58.2, 58.7)); css(dots, { opacity: dA, display: dA > 0 ? 'block' : 'none', transform: `scale(${1 + 0.04 * seg(t, 54.7, 58.7)})`, transformOrigin: '960px 540px' });
};

// ==========================================================================================
// sound: 104 BPM, warm pluck chords, soft percussion after the open, a lift into the closer, chime on the end card
window.buildAudio = async function (ctx) {
  const BPM = 104, B = 60 / BPM, sr = ctx.sampleRate;
  const master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
  const musicBus = ctx.createGain(); musicBus.gain.value = 1; musicBus.connect(master);
  const fxBus = ctx.createGain(); fxBus.gain.value = 1; fxBus.connect(master);
  // seeded noise buffer
  const nb = ctx.createBuffer(1, sr * 2, sr), nd = nb.getChannelData(0), r = rng(99); for (let i = 0; i < nd.length; i++) nd[i] = r() * 2 - 1;
  const noise = (t, dur, f, q, g, type = 'bandpass', bus = fxBus, att = 0.004) => {
    const s = ctx.createBufferSource(); s.buffer = nb; const bf = ctx.createBiquadFilter(); bf.type = type; bf.frequency.value = f; bf.Q.value = q;
    const e = ctx.createGain(); e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(g, t + att); e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bf); bf.connect(e); e.connect(bus); s.start(t, (t * 7.3) % 1.5); s.stop(t + dur + 0.05); return bf;
  };
  const tone = (t, f, dur, g, type = 'sine', bus = musicBus, att = 0.005) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; const e = ctx.createGain();
    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(g, t + att); e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(e); e.connect(bus); o.start(t); o.stop(t + dur + 0.05);
  };
  const N = n => 440 * Math.pow(2, (n - 69) / 12);
  // progression (2 bars each): Cmaj9, Am9, Fmaj7, Gsus/G
  const CH = [[48, 55, 59, 62, 64], [45, 52, 55, 59, 60], [41, 48, 52, 55, 57], [43, 50, 55, 57, 62]];
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.connect(musicBus);
  const padBus = ctx.createGain(); padBus.gain.value = 1; padBus.connect(lp);
  const END = 63.4;
  for (let bar = 0; bar * 4 * B < D; bar++) {
    const t0 = bar * 4 * B, ch = CH[Math.floor(bar / 2) % 4];
    if (t0 > D - 0.5) break;
    const ending = t0 >= END;
    // pad: soft sines, slow attack
    for (const n of ch.slice(0, 4)) tone(t0, N(n + 12), 4 * B + 1.2, ending ? 0.018 : 0.022, 'sine', padBus, 0.6);
    // bass on beat 1 and 3
    if (t0 > 1.6 && !ending) { tone(t0, N(ch[0] - 12), 2 * B, 0.09, 'sine', musicBus, 0.02); tone(t0 + 2 * B, N(ch[0] - 12), 2 * B, 0.07, 'sine', musicBus, 0.02); }
    // plucked 8th-note arpeggio (enters at 1.7, fuller after 4.6)
    if (t0 > 1.5 && !ending) for (let i = 0; i < 8; i++) {
      const tt = t0 + i * B / 2; if (tt < 1.7) continue;
      const n = ch[[1, 2, 3, 4, 3, 2, 4, 3][i]] + 12; const g = tt < 4.6 ? 0.035 : 0.05;
      tone(tt, N(n), 0.42, g, 'triangle', lp, 0.004); tone(tt, N(n + 12), 0.25, g * 0.25, 'sine', lp, 0.004);
    }
    // percussion from 4.6, lift from 58.4, out at the end card
    if (t0 >= 4.5 && !ending) for (let beat = 0; beat < 4; beat++) {
      const tb = t0 + beat * B;
      if (beat % 2 === 0) { const o = ctx.createOscillator(), e = ctx.createGain(); o.frequency.setValueAtTime(110, tb); o.frequency.exponentialRampToValueAtTime(42, tb + 0.18); e.gain.setValueAtTime(0.15, tb); e.gain.exponentialRampToValueAtTime(0.0001, tb + 0.3); o.connect(e); e.connect(musicBus); o.start(tb); o.stop(tb + 0.35); }
      else noise(tb, 0.16, 1800, 0.8, tb > 58.4 ? 0.05 : 0.035, 'bandpass', musicBus);
      for (let h = 0; h < 2; h++) noise(tb + h * B / 2, 0.06, 8000, 1.2, h ? 0.012 : 0.018, 'highpass', musicBus);
    }
  }
  // final chord ring on the end card
  for (const n of [48, 55, 59, 62, 64, 67]) tone(END, N(n + 12), 4.2, 0.03, 'triangle', lp, 0.03);
  tone(END, N(36), 3.5, 0.08, 'sine', musicBus, 0.03);
  // riser into the closer
  { const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true; const bf = ctx.createBiquadFilter(); bf.type = 'bandpass'; bf.Q.value = 2; bf.frequency.setValueAtTime(400, 56.9); bf.frequency.exponentialRampToValueAtTime(5000, 58.4); const e = ctx.createGain(); e.gain.setValueAtTime(0.0001, 56.9); e.gain.exponentialRampToValueAtTime(0.06, 58.35); e.gain.exponentialRampToValueAtTime(0.0001, 58.6); s.connect(bf); bf.connect(e); e.connect(fxBus); s.start(56.9); s.stop(58.7); }
  // sound effects
  for (const t of sfx.keys) { noise(t, 0.03, 3400, 2, 0.05); tone(t, 1800, 0.02, 0.012, 'square', fxBus); }
  for (const t of sfx.ticks) tone(t, 2400, 0.05, 0.03, 'sine', fxBus);
  for (const t of sfx.steps) { tone(t, 1320, 0.12, 0.04, 'sine', fxBus); tone(t + 0.03, 1980, 0.1, 0.02, 'sine', fxBus); }
  for (const t of sfx.clicks) { noise(t, 0.04, 2500, 1.5, 0.12); tone(t, 900, 0.04, 0.05, 'sine', fxBus); }
  for (const t of sfx.whoosh) { const s = ctx.createBufferSource(); s.buffer = nb; const bf = ctx.createBiquadFilter(); bf.type = 'bandpass'; bf.Q.value = 1.2; bf.frequency.setValueAtTime(500, t); bf.frequency.exponentialRampToValueAtTime(2600, t + 0.45); const e = ctx.createGain(); e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(0.045, t + 0.22); e.gain.exponentialRampToValueAtTime(0.0001, t + 0.6); s.connect(bf); bf.connect(e); e.connect(fxBus); s.start(t, (t * 3.1) % 1.2); s.stop(t + 0.65); }
  for (const t of sfx.chime) for (const [f, g, d] of [[N(84), 0.07, 2.4], [N(91), 0.045, 2.0], [N(96), 0.03, 1.6]]) tone(t, f, d, g, 'sine', fxBus, 0.006);
};

// ==========================================================================================
// preview controls (hidden with ?render)
const stage = $('stage');
if (RENDER) { $('ui').style.display = 'none'; }
else {
  const fit = () => { const s = Math.min(innerWidth / 1920, (innerHeight - 54) / 1080); stage.style.transform = `scale(${s})`; stage.style.left = ((innerWidth - 1920 * s) / 2) + 'px'; };
  addEventListener('resize', fit); fit();
  let buf, ac, src, startAt = 0, offset = 0, playing = false;
  async function play() { ac ??= new AudioContext(); if (!buf) { const off = new OfflineAudioContext(2, Math.ceil(48000 * D), 48000); await buildAudio(off); buf = await off.startRendering(); } src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(0, offset % D); startAt = ac.currentTime; playing = true; $('pb').textContent = 'Pause'; }
  function pause() { if (!playing) return; offset += ac.currentTime - startAt; src.stop(); playing = false; $('pb').textContent = 'Play'; }
  const now = () => playing ? (offset + ac.currentTime - startAt) % D : offset;
  $('pb').onclick = () => playing ? pause() : play();
  $('scrub').oninput = e => { const was = playing; pause(); offset = e.target.value / 1000 * D; if (was) play(); };
  (function loop() { const t = now(); seek(t); $('scrub').value = t / D * 1000; $('tc').textContent = t.toFixed(2); requestAnimationFrame(loop); })();
}
seek(0);
</script>
